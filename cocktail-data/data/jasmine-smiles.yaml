name: Jasmine Smiles
recipeElements:
- [1/2, oz, Gin]
- [1/2, oz, Campari]
- [1/2, oz, Cointreau]
- [1/2, oz, Lemon Juice]
- ['4', oz, Champagne, {note: Brut, isBase: true}]
