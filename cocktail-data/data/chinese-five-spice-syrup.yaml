name: Chinese Five-Spice Syrup
recipeElements:
- ['5', pods, Star Anise]
- ['1', tbsp, Fennel Seeds]
- ['1', stick, Cinnamon, note: '3 inches, broken in pieces']
- ['1', tsp, Whole Cloves]
- ['1', tbsp, Szechuan Peppercorns]
- [2 2/3, cup, Simple Syrup]
- ['2', tsp, Honey]
instructions: Grind spices to a coarse powder. Toast spices in a stainless steel
  pot until they smoke (a few seconds). Remove from heat while shaking and 
  tossing. Repeat the toasting steps about three more times, until the spices 
  are very aromatic. Add the simple syrup and bring to a boil. Reduce heat to 
  low and add the honey. Simmer for five minutes, then remove from heat and let 
  the mixture cool. Strain through a fine mesh strainer. Keeps for up to a month
  in the refrigerator.
reference: Imbibe
referenceDetail: January/February 2009, pg 18
indexElements: false
tags: [ingredient]
