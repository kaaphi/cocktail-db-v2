name: Damson Gin
recipeElements:
- ['750', ml, Gin]
- ['6', oz, Sugar]
- ['1', lb, Damson Plums]
instructions: Wash damons. Prick each fruit several times and place in a large 
  jar or bottle. Add the sugar and top up with gin. Shake daily until sugar is 
  dissolved, then store in a cool dark place (at least three months). Strain and
  bottle.
reference: The Cottage Smallholder
indexElements: false
tags: [multipleservings]
