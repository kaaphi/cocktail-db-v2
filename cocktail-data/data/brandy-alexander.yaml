name: Brandy Alexander
recipeElements:
- ['1', oz, Brandy, isBase: true]
- ['1', oz, Dark Crème de Cacao]
- ['1', oz, Heavy Cream]
- ['1', pinch, Freshly Grated Nutmeg]
instructions: Shake all but nutmeg vigorously with ice and strain into a chilled
  cocktail glass. Garnish with the nutmeg.
reference: Field Guide to Cocktails
referenceDetail: pg 36
