name: Volcano House Hot Buttered Rum
recipeElements:
- [1 1/2, oz, Dark Rum, {note: Meyers', isBase: true}]
- [3/4, oz, Lemon Juice]
- [1/4, oz, Maraschino]
- [3/4, oz, Sugar]
- ['5', oz, Hot Black Tea]
- ['1', pat, Unsalted Butter]
instructions: Combine all but butter and tea in a pre-heated mug. Top with hot 
  tea and float butter on top. Garnish with a lemon twist and cloves.
reference: Imbibe
referenceDetail: November/December 2007, pg 32
tags: [winter, hotdrink]
