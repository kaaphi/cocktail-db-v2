name: Daisy de Santiago
recipeElements:
- ['2', oz, Rum, {note: Aged or White, isBase: true}]
- ['1', oz, Lime Juice]
- ['1', dash, Simple Syrup]
- [3/4, oz, Yellow Chartreuse]
- ['1', oz, Soda Water]
instructions: Shake rum, lime, and simple syrup with ice and strain into rocks 
  glass with ice. Add soda water then gently pour the Chartreuse over the top. 
  Garnish with mint.
reference: The Cocktail Chronicles
tags: [newish, refreshing]
